<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2623;--muted:#7a716a;--line:#e6dfd6;--accent:#c4562b;--accent-text:#fff;--ok:#2f7d4f;--bad:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a18;--card:#282421;--text:#f1ece6;--muted:#a79d93;--line:#3b3631;--accent:#e0794d;--accent-text:#1d1a18;--ok:#6fcf97;--bad:#f2867f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;flex-wrap:wrap}
header h1{font-size:1.25rem;margin:0}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:inherit;padding:.4rem .8rem;border-radius:.5rem;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-text)}
main{max-width:1100px;margin:0 auto;padding:1rem}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:.5rem;padding:.5rem .6rem;width:100%}
textarea{min-height:7rem;resize:vertical}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:.5rem;padding:.5rem .9rem;cursor:pointer}
.btn.sec{background:none;color:var(--text);border:1px solid var(--line)}
.btn.bad{background:none;color:var(--bad);border:1px solid var(--bad)}
.btn.small{padding:.25rem .55rem;font-size:.9rem}
.bar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1rem}
.bar .grow{flex:1;min-width:10rem}
.grow{flex:1;min-width:8rem}
.bar select{width:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:.75rem;overflow:hidden;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card img,.card .noimg{width:100%;height:120px;object-fit:cover;display:block;background:var(--line)}
.card .noimg{display:flex;align-items:center;justify-content:center;font-size:2.2rem}
.card .body{padding:.6rem .75rem}
.card .name{font-weight:600}
.muted{color:var(--muted);font-size:.9rem}
.empty{text-align:center;color:var(--muted);padding:3rem 1rem}
table.menu{width:100%;border-collapse:collapse;background:var(--card);border-radius:.75rem;overflow:hidden}
.menu th,.menu td{border:1px solid var(--line);padding:.5rem .6rem;text-align:left;vertical-align:middle}
.menu th{background:var(--bg);font-weight:600}
.menu td.day{width:9rem;font-weight:600}
.slot{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
.slot a{cursor:pointer;color:var(--text)}
.slot a:hover{color:var(--accent)}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1rem}
.add{background:none;border:1px dashed var(--line);border-radius:.4rem;color:var(--muted);width:100%;padding:.3rem;cursor:pointer}
.add:hover{border-color:var(--accent);color:var(--accent)}
ul.shop{list-style:none;padding:0;margin:0;background:var(--card);border:1px solid var(--line);border-radius:.75rem}
ul.shop li{padding:.5rem .8rem;border-bottom:1px solid var(--line)}
ul.shop li:last-child{border-bottom:0}
ul.shop label{display:flex;gap:.6rem;align-items:flex-start;cursor:pointer}
ul.shop input{width:auto;margin-top:.3rem}
ul.shop .done span.t{text-decoration:line-through;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow:auto}
.modal.hidden{display:none}
.box{background:var(--card);border-radius:.9rem;max-width:680px;width:100%;padding:1.1rem 1.25rem}
.box h2{margin:.1rem 0 .6rem;font-size:1.3rem}
.box img.hero{width:100%;max-height:260px;object-fit:cover;border-radius:.6rem;margin-bottom:.6rem}
.box h3{margin:1rem 0 .3rem;font-size:1.05rem}
.box ol,.box ul{padding-left:1.3rem;margin:.2rem 0}
.box li{margin:.25rem 0}
.row{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem}
.row.end{justify-content:flex-end}
.field{margin:.6rem 0}
.field label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.2rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.tabs2{display:flex;gap:.25rem;margin-bottom:.6rem}
.ing-row{display:grid;grid-template-columns:4.5rem 5.5rem 1fr auto;gap:.4rem;align-items:center;margin:.25rem 0}
.ing-row input{padding:.35rem .5rem}
/* Lista de ingredientes: dos columnas. Nombre, contador y botones van
   seguidos en cada celda (sin separarlos hasta el borde). */
.inglist{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem;background:var(--card);
  border:1px solid var(--line);border-radius:.75rem;overflow:hidden}
.ingrow{display:flex;align-items:center;gap:.4rem;padding:.3rem .6rem;
  border-bottom:1px solid var(--line);min-width:0}
.ingrow .n{flex:0 1 auto;min-width:0;font-weight:600;overflow-wrap:anywhere}
.ingrow .c{flex:0 1 auto;min-width:0;color:var(--muted);font-size:.8rem;white-space:nowrap}
/* Un poco de aire antes de los botones: ni pegados al nombre ni
   empujados al borde. */
.ingrow .b{flex:0 0 auto;display:flex;gap:.25rem;margin-left:1.4rem}
/* En pantallas estrechas, una sola columna. */
@media (max-width:560px){.inglist{grid-template-columns:1fr}}
.pick{max-height:50vh;overflow:auto;margin-top:.6rem;border:1px solid var(--line);border-radius:.5rem}
.pick div{padding:.5rem .7rem;border-bottom:1px solid var(--line);cursor:pointer}
.pick div:hover{background:var(--bg)}
#toast{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:.6rem 1rem;border-radius:.6rem;z-index:30;display:none;max-width:90vw}
#toast.err{background:var(--bad);color:#fff}
@media print{header,.bar,.row,.x,.add{display:none!important}}
</style>
</head>
<body>
<header>
  <h1>🍲 Recetario</h1>
  <nav id="tabs">
    <button data-tab="recetas">Recetas</button>
    <button data-tab="menu">Menú semanal</button>
    <button data-tab="compra">Lista de la compra</button>
    <button data-tab="ingredientes">Ingredientes</button>
    <button data-tab="ajustes">Ajustes</button>
  </nav>
</header>
<main id="view"></main>
<div id="modal" class="modal hidden"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
'use strict';
const DAYS = ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
const MEALS = [['lunch','Almuerzo'],['dinner','Cena']];
const COURSES = [['primero','Primero'],['segundo','Segundo'],['postre','Postre'],['unico','Plato único']];
const state = {tab:'recetas', week:null, q:'', category:'', robot:''};
const $ = (s, r = document) => r.querySelector(s);

/* ---------- ingredientes: unidades y parseo de líneas ---------- */
// Lo que se SUGIERE al teclear, en singular y sin repetir. Es solo una
// ayuda: se puede escribir cualquier otra unidad a mano.
// Se deja lo de uso diario y lo que no se puede decir con "unidad":
//   g, kg, ml, l   -> pesos y volúmenes (l sin ml no sirve)
//   taza, cucharada, cucharadita -> medidas de cocina
//   pizca, puñado, unidad -> los tres que usabas
// Lo demas (diente, lata, sobre, hoja, onza, libra...) se acepta al
// escribirlo, pero no se sugiere: para "3 dientes de ajo" basta con
// unidad y el nombre. Cambia esta linea para anadir o quitar alguna.
const UNIT_SUGGEST = ['g','kg','ml','l','taza','cucharada','cucharadita','pizca','puñado','unidad'];

// Lo que el PARSER reconoce al abrir una receta (tolerante a plurales).
const ING_UNITS = ['g','kg','ml','cl','dl','l','cucharada','cucharadas','cucharadita','cucharaditas',
  'taza','tazas','pizca','pizcas','diente','dientes','lata','latas','paquete','paquetes','sobre','sobres',
  'rama','ramas','hoja','hojas','puñado','puñados','onza','onzas','libra','libras','unidad','unidades','ud','uds'];

function parseIngredientLineText(line) {
  // «200 g de harina» -> {qty, unit, name} (empieza por la cantidad)
  let rest = String(line || '').trim();
  let qty = '', unit = '';
  // La fracción va primero: si no, "1/2" se parte en "1" y "/2" y la
  // cantidad se queda mal al guardar.
  let m = rest.match(/^((?:\d+\s+)?\d+\/\d+|\d+(?:[.,]\d+)?)\s*/);
  if (m) { qty = m[1].trim(); rest = rest.slice(m[0].length); }
  m = rest.match(/^([A-Za-zñÑáéíóúÁÉÍÓÚ]+)\.?\s*/);
  if (m && ING_UNITS.includes(m[1].toLowerCase())) {
    unit = m[1];
    rest = rest.slice(m[0].length);
  }
  // No se quita el "de": si no, «3 dientes de ajo» se guardaría como
  // «3 dientes ajo» y cada guardadorait encore más el texto.
  return {qty, unit, name: rest};
}

function ingredientRowToLine(parts) {
  const q = (parts.qty || '').trim();
  const u = (parts.unit || '').trim();
  const n = (parts.name || '').trim();
  if (!n) return '';
  if (q && u) return q + ' ' + u + ' ' + n;
  if (q) return q + ' ' + n;
  if (u) return u + ' ' + n;
  return n;
}

/* ---------- utilidades ---------- */
function el(tag, props = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid !== null && kid !== undefined && kid !== false) e.append(kid.nodeType ? kid : String(kid));
  }
  return e;
}

/* Un solo <datalist> de ingredientes para toda la app: lo usan tanto el
   formulario de receta como el "Renombrar" de la lista. Vive en <body>
   porque el modal reemplaza su contenido cada vez que se abre. */
let INGREDIENTES = [];
function setIngredientSuggestions(names) {
  INGREDIENTES = [...new Set(names.filter(Boolean))].sort((a, b) =>
    a.toLocaleLowerCase('es').localeCompare(b.toLocaleLowerCase('es')));
  let list = document.getElementById('inglist');
  if (!list) {
    list = el('datalist', {id: 'inglist'});
    document.body.append(list);
  }
  list.replaceChildren(...INGREDIENTES.map(n => el('option', {value: n})));
}

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-Recetario': '1'},
    body: JSON.stringify(body)
  };
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) { /* sin cuerpo */ }
  if (!res.ok) throw new Error((data && data.error) || ('Error ' + res.status));
  return data;
}

let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = isErr ? 'err' : '';
  t.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.display = 'none'; }, isErr ? 6000 : 2500);
}
const fail = e => toast(e.message || String(e), true);

function openModal(...content) {
  const box = $('#box');
  box.replaceChildren(...content.flat().filter(x => x !== null && x !== undefined && x !== false));
  $('#modal').classList.remove('hidden');
}
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function mins(n) {
  if (!n) return '';
  const h = Math.floor(n / 60), m = n % 60;
  return (h ? h + ' h ' : '') + (m ? m + ' min' : '');
}
function shiftWeek(week, days) {
  const d = new Date(week + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function todayMonday() {
  const d = new Date();
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  const p = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function weekLabel(week) {
  const f = s => new Date(s + 'T00:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'});
  return 'Semana del ' + f(week) + ' al ' + f(shiftWeek(week, 6));
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copiado'); }
  catch (e) { toast('No se pudo copiar automáticamente', true); }
}

/* ---------- navegación ---------- */
function render() {
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  ({recetas: viewRecetas, menu: viewMenu, compra: viewCompra, ingredientes: viewIngredientes,
      ajustes: viewAjustes})[state.tab]().catch(fail);
}
$('#tabs').addEventListener('click', e => {
  if (e.target.dataset.tab) { state.tab = e.target.dataset.tab; render(); }
});

/* ---------- recetas ---------- */
async function viewRecetas() {
  const [cats, robots] = await Promise.all([api('/api/categories'), api('/api/robots')]);
  const q = el('input', {type:'search', class:'grow', placeholder:'Buscar por nombre, ingrediente…', value: state.q});
  const sel = el('select', {}, el('option', {value:''}, 'Todas las categorías'),
    cats.filter(c => c.name).map(c => el('option', {value:c.name}, c.name + ' (' + c.count + ')')));
  sel.value = state.category;
  const selRobot = el('select', {}, el('option', {value:''}, 'Todos los robots'),
    robots.map(r => el('option', {value:r}, r)));
  selRobot.value = state.robot;
  const grid = el('div', {class:'grid'});
  const refresh = async () => {
    const list = await api('/api/recipes?q=' + encodeURIComponent(state.q) + '&category=' + encodeURIComponent(state.category) + '&robot=' + encodeURIComponent(state.robot));
    grid.replaceChildren(...list.map(recipeCard));
    if (!list.length) grid.replaceChildren(el('div', {class:'empty'},
      state.q || state.category || state.robot ? 'No hay recetas con ese filtro.' : 'Todavía no hay recetas. Pulsa «＋ Añadir receta».'));
  };
  let timer;
  q.addEventListener('input', () => { state.q = q.value; clearTimeout(timer); timer = setTimeout(() => refresh().catch(fail), 200); });
  sel.addEventListener('change', () => { state.category = sel.value; refresh().catch(fail); });
  selRobot.addEventListener('change', () => { state.robot = selRobot.value; refresh().catch(fail); });
  $('#view').replaceChildren(
    el('div', {class:'bar'}, q, sel, selRobot, el('button', {class:'btn', onclick: () => openAdd()}, '＋ Añadir receta')),
    grid);
  await refresh();
}

function recipeCard(r) {
  const meta = [r.category, r.robot, mins(r.total_minutes)].filter(Boolean).join(' · ');
  return el('div', {class:'card', onclick: () => openRecipe(r.id)},
    r.image_file ? el('img', {src:'/images/' + encodeURIComponent(r.image_file), loading:'lazy', alt:''}) : el('div', {class:'noimg'}, '🍽️'),
    el('div', {class:'body'}, el('div', {class:'name'}, r.name), el('div', {class:'muted'}, meta || '\u00a0')));
}

async function openRecipe(id) {
  const r = await api('/api/recipe/' + id);
  const meta = [r.category, r.robot, mins(r.total_minutes), r.servings ? r.servings + ' raciones' : ''].filter(Boolean).join(' · ');
  openModal(
    r.image_file ? el('img', {class:'hero', src:'/images/' + encodeURIComponent(r.image_file), alt:''}) : null,
    el('h2', {}, r.name),
    el('div', {class:'muted'}, meta),
    r.description ? el('p', {}, r.description) : null,
    el('h3', {}, 'Ingredientes'),
    el('ul', {}, (r.ingredients || []).map(i => el('li', {}, i))),
    el('h3', {}, 'Preparación'),
    el('ol', {}, (r.instructions || []).map(s => el('li', {}, s))),
    r.notes ? [el('h3', {}, 'Notas'), el('p', {}, r.notes)] : null,
    /^https?:\/\//.test(r.source_url || '') ? el('p', {class:'muted'}, 'Origen: ', el('a', {href:r.source_url, target:'_blank', rel:'noopener noreferrer'}, r.source_url)) : null,
    el('div', {class:'row'},
      el('button', {class:'btn', onclick: () => openAddToMenu(r)}, '📅 Añadir al menú'),
      el('button', {class:'btn sec', onclick: () => openForm(r)}, 'Editar'),
      el('button', {class:'btn bad', onclick: async () => {
        if (!confirm('¿Borrar «' + r.name + '»? También se quitará del menú.')) return;
        try { await api('/api/recipe/' + r.id + '/delete', {}); closeModal(); toast('Receta borrada'); render(); } catch (e) { fail(e); }
      }}, 'Borrar'),
      el('button', {class:'btn sec', onclick: closeModal}, 'Cerrar')));
}

function openAdd() {
  const url = el('input', {type:'text', placeholder:'https://…  (dirección de la receta)'});
  const go = async () => {
    btn.disabled = true; btn.textContent = 'Importando…';
    try {
      const r = await api('/api/import', {url: url.value});
      toast('Importada: ' + r.name); render(); openRecipe(r.id);
    } catch (e) { fail(e); btn.disabled = false; btn.textContent = 'Importar'; }
  };
  url.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  const btn = el('button', {class:'btn', onclick: go}, 'Importar');
  openModal(el('h2', {}, 'Añadir receta'),
    el('div', {class:'field'}, el('label', {}, 'Desde una web'), url),
    el('div', {class:'row'}, btn,
      el('button', {class:'btn sec', onclick: () => openForm(null)}, 'Escribirla a mano'),
      el('button', {class:'btn sec', onclick: closeModal}, 'Cancelar')),
    el('p', {class:'muted'}, 'Si una web no se puede leer, copia el texto de la receta y pégalo en «Escribirla a mano».'));
  url.focus();
}

async function openForm(r) {
  const [cats, robots, ingredientes] = await Promise.all([
    api('/api/categories'), api('/api/robots'), api('/api/ingredients')]);
  // Sugerencias de ingredientes para los campos de abajo.
  setIngredientSuggestions(ingredientes.map(i => i.name));
  const f = {
    name: el('input', {type:'text', value: r ? r.name : ''}),
    category: el('input', {type:'text', list:'catlist', value: r ? (r.category || '') : ''}),
    robot: el('select', {}, el('option', {value:''}, '(sin robot)'),
      robots.map(rb => el('option', {value:rb, selected: r && r.robot === rb}, rb))),
    servings: el('input', {type:'number', min:'1', value: r && r.servings ? r.servings : ''}),
    total: el('input', {type:'number', min:'1', value: r && r.total_minutes ? r.total_minutes : ''}),
    steps: el('textarea', {}, r ? (r.instructions || []).join('\n') : ''),
    notes: el('textarea', {style:'min-height:4rem'}, r ? (r.notes || '') : '')
  };
  const field = (label, node) => el('div', {class:'field'}, el('label', {}, label), node);

  /* Ingredientes: una fila por ingrediente (cantidad | unidad | nombre).
     El «+» añade una fila y deja el foco en la cantidad. */
  const ingBox = el('div', {});
  const addRow = (qty = '', unit = '', name = '', focusQty = false) => {
    const qEl = el('input', {type:'text', placeholder:'Cantidad', value:qty});
    const uEl = el('input', {type:'text', placeholder:'Unidad', value:unit, list:'unitlist'});
    // list='inglist': sugiere los ingredientes que ya usas al teclear.
    const nEl = el('input', {type:'text', placeholder:'Ingrediente', value:name, list:'inglist'});
    const del = el('button', {class:'x', title:'Quitar', onclick: () => row.remove()}, '✕');
    const row = el('div', {class:'ing-row'}, qEl, uEl, nEl, del);
    // ingredientRowToLine espera {qty, unit, name} con texto plano, no los
    // inputs: por eso se guardan los campos y se leen al guardar.
    row._fields = {qty: qEl, unit: uEl, name: nEl};
    ingBox.append(row);
    if (focusQty) qEl.focus();
    return row;
  };
  (r ? (r.ingredients || []) : []).forEach(line => {
    const p = parseIngredientLineText(line);
    addRow(p.qty, p.unit, p.name);
  });

  openModal(el('h2', {}, r ? 'Editar receta' : 'Nueva receta'),
    field('Nombre *', f.name),
    el('div', {class:'two'}, field('Categoría', f.category), field('Robot de cocina', f.robot)),
    el('div', {class:'two'}, field('Raciones', f.servings), field('Tiempo total (minutos)', f.total)),
    el('datalist', {id:'catlist'}, cats.filter(c => c.name).map(c => el('option', {value:c.name}))),
    el('datalist', {id:'unitlist'}, UNIT_SUGGEST.map(u => el('option', {value:u}))),
    el('div', {class:'field'}, el('label', {}, 'Ingredientes'),
      ingBox,
      el('button', {class:'add', onclick: () => addRow('', '', '', true)}, '＋ Añadir ingrediente')),
    field('Pasos (uno por línea)', f.steps),
    field('Notas', f.notes),
    el('div', {class:'row end'},
      el('button', {class:'btn sec', onclick: closeModal}, 'Cancelar'),
      el('button', {class:'btn', onclick: async () => {
        const ingredients = [];
        ingBox.querySelectorAll('.ing-row').forEach(row => {
          const f2 = row._fields;
          const line = ingredientRowToLine({qty: f2.qty.value, unit: f2.unit.value, name: f2.name.value});
          if (line) ingredients.push(line);
        });
        const body = {name: f.name.value, category: f.category.value, robot: f.robot.value, servings: f.servings.value,
          total_minutes: f.total.value, ingredients: ingredients, instructions: f.steps.value, notes: f.notes.value};
        try {
          const saved = await api(r ? '/api/recipe/' + r.id : '/api/recipe', body);
          closeModal(); toast('Guardada'); render(); openRecipe(saved.id);
        } catch (e) { fail(e); }
      }}, 'Guardar')));
  f.name.focus();
}

/* ---------- menú semanal ---------- */
async function loadMenu() {
  const m = await api('/api/menu' + (state.week ? '?week=' + state.week : ''));
  state.week = m.week;
  return m;
}
function weekNav(after) {
  const go = async days => { state.week = shiftWeek(state.week, days); after(); };
  return el('div', {class:'bar'},
    el('button', {class:'btn sec', onclick: () => go(-7)}, '‹'),
    el('strong', {}, weekLabel(state.week)),
    el('button', {class:'btn sec', onclick: () => go(7)}, '›'),
    el('button', {class:'btn sec small', onclick: () => { state.week = todayMonday(); after(); }}, 'Hoy'));
}

async function viewMenu() {
  const m = await loadMenu();
  const rows = m.days.map(d => el('tr', {},
    el('td', {class:'day'}, d.name, el('div', {class:'muted'}, new Date(d.date + 'T00:00:00').toLocaleDateString('es-ES', {day:'numeric', month:'short'}))),
    MEALS.map(([key]) => {
      const dishes = d.meals[key] || {};
      const cell = el('td', {});

      // Un solo boton para anadir: el tipo de plato se elige al abrir
      // el selector de recetas, no antes.
      const anadir = () => pickRecipe(async (rec, curso) => {
        try {
          await api('/api/menu/set', {week: m.week, day: d.index, meal: key,
                                      recipe_id: rec.id, course: curso});
          render();
        } catch (e) { fail(e); }
      }, true);

      const puesta = (ckey, clabel) => {
        const r = dishes[ckey];
        return el('div', {class:'slot'},
          el('span', {}, el('span', {class:'muted'}, clabel + ': '),
                           el('a', {onclick: () => openRecipe(r.id)}, r.name)),
          el('button', {class:'x', title:'Quitar', onclick: async () => {
            try {
              await api('/api/menu/clear', {week: m.week, day: d.index, meal: key, course: ckey});
              render();
            } catch (e) { fail(e); }
          }}, '✕'));
      };

      if (Object.keys(dishes).length) {
        // Si ya hay platos, se ven con su tipo y se puede anadir otro.
        for (const [ckey, clabel] of COURSES)
          if (dishes[ckey]) cell.append(puesta(ckey, clabel));
      }
      cell.append(el('button', {class:'add', onclick: () => anadir()}, '＋ Añadir plato'));
      return cell;
    })));
  $('#view').replaceChildren(
    weekNav(render),
    el('table', {class:'menu'}, el('thead', {}, el('tr', {}, el('th', {}, 'Día'), MEALS.map(([, n]) => el('th', {}, n)))), el('tbody', {}, rows)),
    el('div', {class:'row'},
      el('button', {class:'btn sec', onclick: () => api('/api/menu_text?week=' + m.week).then(t => copyText(t.text)).catch(fail)}, '📋 Copiar menú'),
      el('button', {class:'btn sec', onclick: async () => {
        try { await api('/api/menu/copy', {src: m.week, dst: shiftWeek(m.week, 7)}); state.week = shiftWeek(m.week, 7); toast('Copiado a la semana siguiente'); render(); } catch (e) { fail(e); }
      }}, 'Copiar a la semana siguiente'),
      el('button', {class:'btn bad', onclick: async () => {
        if (!confirm('¿Vaciar esta semana?')) return;
        try { await api('/api/menu/clear_week', {week: m.week}); render(); } catch (e) { fail(e); }
      }}, 'Vaciar semana'),
      el('button', {class:'btn sec', onclick: () => window.print()}, '🖨️ Imprimir')),
    bloquePlantillas(m.week, render));
}

// onPick(recipe) recibe la receta. Si conTipo es true, se muestra arriba el
// desplegable de tipo de plato y onPickCursor devuelve el valor elegido.
async function pickRecipe(onPick, conTipo = false, tipoInicial = 'unico') {
  const q = el('input', {type:'search', placeholder:'Buscar receta…'});
  const list = el('div', {class:'pick'});
  const tipo = el('select', {}, COURSES.map(([k, n]) =>
    el('option', {value: k, selected: k === tipoInicial}, n)));
  let cursor = tipoInicial;
  tipo.addEventListener('change', () => { cursor = tipo.value; });
  const refresh = async () => {
    const items = await api('/api/recipes?q=' + encodeURIComponent(q.value));
    list.replaceChildren(...(items.length ? items.map(r => el('div', {onclick: async () => {
      try { await onPick(r, cursor); closeModal(); } catch (e) { fail(e); }
    }}, r.name, el('span', {class:'muted'}, (r.category ? '  · ' + r.category : '') + (r.robot ? ' · ' + r.robot : '')))) : [el('div', {class:'muted'}, 'No hay recetas.')]));
  };
  q.addEventListener('input', () => refresh().catch(fail));
  openModal(el('h2', {}, 'Elige una receta'),
    conTipo ? el('div', {class:'field'}, el('label', {}, 'Tipo de plato'), tipo) : null,
    q, list,
    el('div', {class:'row end'}, el('button', {class:'btn sec', onclick: closeModal}, 'Cancelar')));
  q.focus();
  await refresh();
}

async function openAddToMenu(r) {
  const m = await loadMenu();
  const week = el('select', {}, [-7, 0, 7, 14].map(off => {
    const w = shiftWeek(m.week, off);
    return el('option', {value:w, selected: off === 0}, weekLabel(w));
  }));
  const day = el('select', {}, DAYS.map((d, i) => el('option', {value:i}, d)));
  const meal = el('select', {}, MEALS.map(([k, n]) => el('option', {value:k}, n)));
  const course = el('select', {}, COURSES.map(([k, n]) => el('option', {value:k, selected: k === 'unico'}, n)));
  openModal(el('h2', {}, 'Añadir «' + r.name + '» al menú'),
    el('div', {class:'field'}, el('label', {}, 'Semana'), week),
    el('div', {class:'two'},
      el('div', {class:'field'}, el('label', {}, 'Día'), day),
      el('div', {class:'field'}, el('label', {}, 'Comida'), meal)),
    el('div', {class:'field'}, el('label', {}, 'Plato'), course),
    el('div', {class:'row end'},
      el('button', {class:'btn sec', onclick: closeModal}, 'Cancelar'),
      el('button', {class:'btn', onclick: async () => {
        try {
          await api('/api/menu/set', {week: week.value, day: Number(day.value), meal: meal.value, recipe_id: r.id, course: course.value});
          state.week = week.value; closeModal(); toast('Añadida al menú'); if (state.tab === 'menu') render();
        } catch (e) { fail(e); }
      }}, 'Añadir')));
}

/* ---------- lista de la compra ---------- */
async function viewCompra() {
  if (!state.week) await loadMenu();
  const res = await api('/api/shopping?week=' + state.week);
  const ul = el('ul', {class:'shop'}, res.items.map(i => {
    const cb = el('input', {type:'checkbox'});
    const li = el('li', {}, el('label', {}, cb, el('span', {}, el('span', {class:'t'}, i.text),
      i.recipes.length ? el('div', {class:'muted'}, i.recipes.join(', ')) : null)));
    cb.addEventListener('change', () => li.classList.toggle('done', cb.checked));
    return li;
  }));
  $('#view').replaceChildren(
    weekNav(render),
    res.items.length ? ul : el('div', {class:'empty'}, 'No hay recetas en el menú de esta semana.'),
    res.items.length ? el('div', {class:'row'},
      el('button', {class:'btn sec', onclick: () => copyText('Lista de la compra\n\n' + res.items.map(i => '- ' + i.text).join('\n'))}, '📋 Copiar lista'),
      el('button', {class:'btn sec', onclick: () => window.print()}, '🖨️ Imprimir')) : null);
}

/* ---------- ingredientes ---------- */
async function viewIngredientes() {
  const list = await api('/api/ingredients');
  setIngredientSuggestions(list.map(i => i.name));
  const board = el('div', {id:'ingBoard', class:'inglist'});
  const paint = () => {
    api('/api/ingredients').then(items => {
      board.replaceChildren(...(items.length ? items.map(i => {
        // Nombre, contador y botones seguido, sin separar el nombre del
        // boton hasta el borde de la pantalla.
        const row = el('div', {class:'ingrow'},
          el('span', {class:'n'}, i.name),
          el('span', {class:'c'}, i.count + (i.count === 1 ? ' receta' : ' recetas')),
          el('span', {class:'b'},
            el('button', {class:'btn small sec', onclick: () => editIngredient(i, row)}, 'Renombrar'),
            el('button', {class:'btn small bad', onclick: async () => {
              if (!confirm('¿Quitar «' + i.name + '» de todas las recetas?')) return;
              try {
                const r = await api('/api/ingredients/delete', {name: i.name});
                toast('Quitado de ' + r.changed + ' línea' + (r.changed === 1 ? '' : 's'));
                paint();
              } catch (e) { fail(e); }
            }}, 'Quitar')));
        return row;
      }) : [el('div', {class:'muted', style:'padding:.6rem'}, 'Aún no hay ingredientes. Añade recetas con ingredientes.')]));
    }).catch(fail);
  };
  $('#view').replaceChildren(
    el('h2', {}, 'Ingredientes'),
    el('p', {class:'muted'}, 'Todos los ingredientes usados en tus recetas. Al renombrar o quitar uno, cambia en todas las recetas a la vez.'),
    board);
  paint();
}

function editIngredient(i, row) {
  // Sugiere los ingredientes que ya tienes, para no crear duplicados
  // por escribir "Tomate" en vez de "tomate".
  const input = el('input', {type:'text', value: i.name, list:'inglist'});
  const save = el('button', {class:'btn small', onclick: async () => {
    try {
      const r = await api('/api/ingredients/rename', {old: i.name, new: input.value});
      toast('Renombrado en ' + r.changed + ' línea' + (r.changed === 1 ? '' : 's'));
      viewIngredientes();
    } catch (e) { fail(e); }
  }}, 'Guardar');
  const cancel = el('button', {class:'btn small sec', onclick: viewIngredientes}, 'Cancelar');
  row.replaceChildren(el('span', {class:'grow'}, input), el('span', {class:'b'}, save, cancel));
  input.focus();
  input.select();
}

/* ---------- plantillas de menú (bloque dentro de Menú semanal) ---------- */
function bloquePlantillas(week, alCambiar) {
  const nombre = el('input', {type:'text', placeholder:'Nombre, p. ej. Semana normal', class:'grow'});
  const lista = el('div', {class:'inglist'});

  const guardar = el('button', {class:'btn sec', onclick: async () => {
    const n = nombre.value.trim();
    if (!n) { toast('Ponle un nombre a la plantilla', true); nombre.focus(); return; }
    try {
      const r = await api('/api/template/save', {name: n, week: week});
      toast('Guardada «' + r.name + '» con ' + r.dishes + ' platos');
      nombre.value = '';
      paint();
    } catch (e) { fail(e); }
  }}, '💾 Guardar la semana como plantilla');

  nombre.addEventListener('keydown', e => { if (e.key === 'Enter') guardar.click(); });

  const paint = async () => {
    const res = await api('/api/templates');
    if (!res.items.length) {
      lista.replaceChildren(el('div', {class:'muted', style:'padding:.6rem'},
        'Aún no has guardado ninguna plantilla. Cuando te guste una semana, guárdala aquí '
        + 'y podrás volver a ponerla cuando quieras.'));
      return;
    }
    lista.replaceChildren(...res.items.map(t => el('div', {class:'ingrow'},
      el('span', {class:'n'}, t.name),
      el('span', {class:'c'}, t.dishes + (t.dishes === 1 ? ' plato' : ' platos')),
      el('span', {class:'b'},
        el('button', {class:'btn small sec', onclick: async () => {
          if (!confirm('¿Poner «' + t.name + '» en la semana del ' + weekLabel(week)
                       + '?\n\nSe sustituirá lo que haya ahora en esa semana.')) return;
          try {
            const r = await api('/api/template/apply', {name: t.name, week: week});
            toast(r.skipped
              ? 'Aplicada. ' + r.skipped + ' plato(s) ya no existen y se saltaron.'
              : 'Aplicada a la semana del ' + weekLabel(week));
            if (alCambiar) alCambiar();
          } catch (e) { fail(e); }
        }}, 'Usar esta semana'),
        el('button', {class:'btn small bad', onclick: async () => {
          if (!confirm('¿Borrar la plantilla «' + t.name + '»?')) return;
          try { await api('/api/template/delete', {name: t.name}); toast('Plantilla borrada'); paint(); }
          catch (e) { fail(e); }
        }}, 'Quitar')))));
  };

  const caja = el('div', {},
    el('hr'),
    el('h3', {}, 'Plantillas'),
    el('p', {class:'muted'}, 'Guarda esta semana para poder repetirla sin elegir los platos uno a uno.'),
    el('div', {class:'bar'}, nombre, guardar),
    lista);
  paint().catch(fail);
  return caja;
}

/* ---------- ajustes ---------- */
async function viewAjustes() {
  const s = await api('/api/settings');
  const robotsList = await api('/api/robots');
  const folder = el('input', {type:'text', placeholder:'/home/neus/Drive/Recetas', value: s.sync_folder || ''});
  // Rutas habituales, para no tener que escribirlas a mano.
  const selRuta = el('select', {},
    el('option', {value:''}, '— rutas sugeridas —'),
    ['/home/neus/Drive/Recetas', '/home/neus/Recetario', '/home/neus/Documents/Recetario',
     '/home/neus/Desktop/Recetas'].map(p => el('option', {value: p}, p)));
  selRuta.addEventListener('change', () => { if (selRuta.value) folder.value = selRuta.value; });
  const out = el('p', {class:'muted'});
  $('#view').replaceChildren(
    el('h2', {}, 'Ajustes'),
    el('p', {}, 'Tus recetas se guardan en: ', el('code', {}, s.data_dir)),
    el('p', {class:'muted'}, s.es_tablet
      ? 'Para pasar recetas entre el ordenador y la tablet, con el cable conectado, '
        + 'ejecuta en el ordenador: bash ~/bin/sincronizar_tablet.sh'
      : 'Con la tablet conectada por cable, este botón también le manda las recetas '
        + 'y las plantillas (la app tiene que estar abierta en ella).'),
    el('div', {class:'field'}, el('label', {}, 'Carpeta de copia (solo para el ordenador: una carpeta '
      + 'sincronizada con Drive. Las carpetas del explorador de archivos no valen)'),
      el('div', {class:'row'}, folder,
        el('button', {class:'btn sec', onclick: async () => {
          // Selector de carpetas del navegador (Chromium). Si no existe,
          // se avisa para que se escriba la ruta a mano.
          if (!window.showDirectoryPicker) {
            toast('Este navegador no tiene selector de carpeta: escribe la ruta a mano', true);
            folder.focus();
            return;
          }
          try {
            const d = await window.showDirectoryPicker({mode: 'readwrite'});
            folder.value = d.name;
            // El navegador da el nombre, no la ruta: se ofrecen las de casa.
            const propuestas = ['/home/' + d.name, '/home/' + d.name + '/Drive/Recetas',
                                '/home/' + d.name + '/Documentos/Recetas'];
            selRuta.replaceChildren(...propuestas.map(p =>
              el('option', {value: p}, p)));
            selRuta.value = folder.value;
          } catch (e) { /* cancelado */ }
        }}, '📁 Elegir carpeta…'))),
    el('div', {class:'field'}, el('label', {}, 'O elige una ruta de las de tu equipo'),
      selRuta),
    el('div', {class:'row'},
      el('button', {class:'btn', onclick: async () => {
        try { await api('/api/settings', {sync_folder: folder.value}); toast('Guardado'); } catch (e) { fail(e); }
      }}, 'Guardar carpeta'),
      el('button', {class:'btn', onclick: async () => {
        out.textContent = 'Sincronizando…';
        try {
          await api('/api/settings', {sync_folder: folder.value});
          const r = await api('/api/sync', {});
          // Si el servidor va con el codigo viejo (la app esta abierta
          // desde antes de una actualizacion) no trae "tablet": en vez de
          // decir "no se pudo", se muestra lo que si se ha hecho.
          if (r.carpeta === undefined && r.tablet === undefined) {
            out.textContent = 'Carpeta: ' + r.recipes + ' recetas ('
              + r.added + ' nuevas, ' + r.removed + ' quitadas).\n'
              + 'Aviso: la app esta abierta con una version antigua; reinicia '
              + 'Recetario para poder sincronizar tambien con la tablet.';
            toast('Sincronizado con la carpeta');
            return;
          }
          const lineas = [];
          if (r.carpeta) lineas.push('Carpeta: ' + r.carpeta.recipes + ' recetas ('
            + r.carpeta.added + ' nuevas, ' + r.carpeta.removed + ' quitadas).');
          if (r.tablet) lineas.push('Tablet ' + r.tablet.tablet + ': traídas '
            + r.tablet.traidas.recetas + ' y enviadas ' + r.tablet.enviadas.recetas
            + ' recetas (' + r.tablet.enviadas.fotos + ' fotos).');
          for (const a of (r.avisos || [])) lineas.push('· ' + a);
          out.textContent = lineas.join('\n');
          toast(r.tablet || r.carpeta ? 'Sincronizado' : 'No se pudo sincronizar',
                !(r.tablet || r.carpeta));
        } catch (e) { out.textContent = e.message || String(e); fail(e); }
      }}, s.es_tablet ? '🔄 Sincronizar carpeta'
                   : '🔄 Sincronizar ahora (carpeta y tablet)')),
    out,
    el('p', {class:'muted'}, 'Sincronizar fusiona los cambios: lo más reciente gana y lo que borras en un sitio se borra en el otro.'),
    el('hr'),
    el('h3', {}, 'Robots de cocina'),
    el('p', {class:'muted'}, 'Estos robots se usan para clasificar las recetas. Puedes añadir, renombrar o borrar.'),
    el('div', {id:'robotList'}),
    el('div', {class:'bar'}, el('input', {type:'text', id:'newRobot', class:'grow', placeholder:'Nuevo robot (ej. Thermomix)'}),
      el('button', {class:'btn', onclick: async () => {
        try { await api('/api/robot/add', {name: $('#newRobot').value}); toast('Robot añadido'); viewAjustes(); } catch (e) { fail(e); }
      }}, 'Añadir')),
    el('hr'),
    el('button', {class:'btn bad', onclick: async () => {
      try { await api('/api/quit', {}); document.body.replaceChildren(el('main', {}, el('div', {class:'empty'}, 'Recetario se ha cerrado. Ya puedes cerrar esta pestaña.'))); } catch (e) { fail(e); }
    }}, 'Cerrar Recetario'));
  const board = $('#robotList');
  board.replaceChildren(...(robotsList.length ? robotsList.map(r => el('div', {class:'slot', style:'margin:.2rem 0'},
    el('span', {}, r),
    el('span', {},
      el('button', {class:'btn small sec', style:'margin-right:.3rem', onclick: async () => {
        const nu = prompt('Nuevo nombre para «' + r + '»:', r);
        if (nu && nu !== r) { try { await api('/api/robot/rename', {old: r, new: nu}); toast('Renombrado'); viewAjustes(); } catch (e) { fail(e); } }
      }}, 'Renombrar'),
      el('button', {class:'btn small bad', onclick: async () => {
        if (!confirm('¿Quitar «' + r + '» de la lista? Las recetas que lo usen quedarán sin robot.')) return;
        try { await api('/api/robot/delete', {name: r}); toast('Quitado'); viewAjustes(); } catch (e) { fail(e); }
      }}, 'Borrar')))) : [el('div', {class:'muted'}, 'Aún no hay robots. Añade el primero abajo.')]));
}

render();
</script>
