name: recetario
version: "1.0.0"
base: core24
summary: Recetario y menú semanal
description: |
  Recetario para Ubuntu Touch: recetas, menú semanal y lista de la compra.
  Los datos se guardan en la propia tablet y se pueden sincronizar con el
  ordenador copiando la carpeta de datos.

confinement: strict
grade: stable

platforms:
  arm64:
  amd64:

apps:
  recetario:
    command: usr/lib/qt5/bin/qmlscene $SNAP/qml/Main.qml
    command-chain:
      - bin/gpu-2404-wrapper
      - bin/lomiri-launch
    plugs:
      - opengl
      - wayland
      - home
      - network
      - network-bind
      - unity7
      # Para leer y escribir en ~/Documents, que es la carpeta que la tablet
      # expone por MTP: asi se copian las recetas desde el PC arrastrando
      # la carpeta, sin tocar permisos rareos.
      - personal-files:
          read:
            - ~/Documents
          write:
            - ~/Documents
    environment:
      QTWEBVIEW_DISABLE_SANDBOX: "1"
      # En un snap $HOME es la carpeta privada del snap, no la del usuario,
      # asi que se pone la ruta real (en Ubuntu Touch es phablet).
      RECETARIO_DIR: "/home/phablet/Documents/Recetario"

parts:
  main:
    plugin: cmake
    source: .
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/
    build-snaps:
      - lomiri-ui-toolkit-core24
    build-packages:
      - qtbase5-dev
      - qtbase5-dev-tools
      - qtdeclarative5-dev
      - qtquickcontrols2-5-dev
      - intltool
      - qt5-webengine-dev-tools
    stage-packages:
      - qmlscene
      - python3
      - qml-module-io-thp-pyotherside
      - qml-module-qtwebview
      - qml-module-lomiri-components
    override-prime: |
        craftctl default
        mkdir -p ${CRAFT_PRIME}/bin
        cp -a /snap/lomiri-ui-toolkit-core24/current/command-chain/lomiri-launch ${CRAFT_PRIME}/bin/lomiri-launch

  gpu-2404:
    after:
      - main
    source: https://github.com/canonical/gpu-snap.git
    plugin: dump
    override-prime: |
      craftctl default
      ${CRAFT_PART_SRC}/bin/gpu-2404-cleanup mesa-2404
    prime:
      - bin/gpu-2404-wrapper